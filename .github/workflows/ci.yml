name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check package
        run: python scripts/check_package.py
      - name: Build distribution archives
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: conduct-best-skills-packages
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
