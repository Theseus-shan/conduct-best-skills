<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">conduct-best-skills：从目标到证据</title><desc id="desc">流程规则示意，不代表实验数据或真实执行记录。</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif"><path d="M 44 55 H 128" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round"/><text x="145" y="61" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">科研与开发</text><text x="44" y="136" font-size="53" fill="#233345" font-weight="700" text-anchor="start">conduct-best-skills</text><text x="44" y="189" font-size="29" fill="#607181" font-weight="400" text-anchor="start">让目标落到成果与证据。</text><text x="44" y="260" font-size="21" fill="#233345" font-weight="400" text-anchor="start">理解真正的目标。</text><text x="44" y="294" font-size="21" fill="#233345" font-weight="400" text-anchor="start">协调合适的能力。</text><text x="44" y="328" font-size="21" fill="#233345" font-weight="400" text-anchor="start">验证实际的成果。</text><circle cx="760" cy="214" r="26" fill="#ffffff" stroke="#167d8d" stroke-width="1.8"/><circle cx="760" cy="214" r="15" fill="#ffffff" stroke="#167d8d" stroke-width="1.8"/><circle cx="760" cy="214" r="4" fill="#167d8d" stroke="#167