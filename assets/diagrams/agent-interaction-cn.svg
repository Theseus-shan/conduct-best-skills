<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 645" role="img" aria-labelledby="title desc"><title id="title">三类交互方式与决策边界</title><desc id="desc">流程规则示意，不代表实验数据或真实执行记录。</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1080" height="645" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">c</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">有明确决策边界的自主执行</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">交互示意，并非运行实录或可操作界面</text><text x="36" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">a</text><text x="66" y="130" font-size="23" fill="#167d8d" font-weight="600" text-anchor="start">明确任务</text><rect x="36" y="165" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="196" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">用户</text><text x="53" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">在当前范围内修复。</text><path d="M 191 261 V 290" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="36" y="290" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="321" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">宿主与总控技能</text><text x="53" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">读取 → 选择 → 执行</text><path d="M 191 386 V 415" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="36" y="415" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="446" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">工具 → 宿主</text><text x="53" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">核查实际结果。</text><text x="36" y="552" font-size="18" fill="#167d8d" font-weight="600" text-anchor="start">在授权范围内继续</text><text x="378" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">b</text><text x="408" y="130" font-size="23" fill="#ae662c" font-weight="600" text-anchor="start">目标存在歧义</text><rect x="378" y="165" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="196" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">用户</text><text x="395" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">改进这个模块。</text><path d="M 533 261 V 290" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ae662c)"/><rect x="378" y="290" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="321" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">宿主与总控技能</text><text x="395" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">局部修复还是重设计？</text><path d="M 533 386 V 415" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ae662c)"/><rect x="378" y="415" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="446" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">用户 → 宿主</text><text x="395" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">确认实质性变更。</text><text x="378" y="552" font-size="18" fill="#ae662c" font-weight="600" text-anchor="start">仅受影响工作等待</text><text x="720" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">c</text><text x="750" y="130" font-size="23" fill="#536ca0" font-weight="600" text-anchor="start">多种能力协同</text><rect x="720" y="165" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="196" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">用户</text><text x="737" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">审查两个模块。</text><path d="M 875 261 V 290" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round" marker-end="url(#536ca0)"/><rect x="720" y="290" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="321" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">宿主与总控技能</text><text x="737" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">选择可用专业能力。</text><path d="M 875 386 V 415" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round" marker-end="url(#536ca0)"/><rect x="720" y="415" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="446" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">可选子代理 → 宿主</text><text x="737" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">回传证据供主代理整合。</text><text x="720" y="552" font-size="18" fill="#536ca0" font-weight="600" text-anchor="start">委派必须获准</text><text x="36" y="609" font-size="18" fill="#607181" font-weight="400" text-anchor="start">技能指导方法，工具执行操作；子代理按收益、环境支持与授权选择。</text></g></svg>
