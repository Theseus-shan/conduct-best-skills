<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 645" role="img" aria-labelledby="title desc"><title id="title">Three interaction patterns with decision boundaries</title><desc id="desc">Conceptual workflow instructions; not experimental data or a recorded execution.</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1080" height="645" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">c</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">Autonomy with decision boundaries</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">Illustrative interactions, not recorded runs or an interactive interface</text><text x="36" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">a</text><text x="66" y="130" font-size="23" fill="#167d8d" font-weight="600" text-anchor="start">Clear task</text><rect x="36" y="165" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="196" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">User</text><text x="53" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Fix within this scope.</text><path d="M 191 261 V 290" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="36" y="290" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="321" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">Host + coordinating Skill</text><text x="53" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Read → select → execute</text><path d="M 191 386 V 415" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="36" y="415" width="310" height="96" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="53" y="446" font-size="16" fill="#167d8d" font-weight="600" text-anchor="start">Tools → host</text><text x="53" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Check the actual result.</text><text x="36" y="552" font-size="18" fill="#167d8d" font-weight="600" text-anchor="start">Continue within authority</text><text x="378" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">b</text><text x="408" y="130" font-size="23" fill="#ae662c" font-weight="600" text-anchor="start">Ambiguous goal</text><rect x="378" y="165" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="196" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">User</text><text x="395" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Improve this module.</text><path d="M 533 261 V 290" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ae662c)"/><rect x="378" y="290" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="321" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">Host + coordinating Skill</text><text x="395" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Local fix or redesign?</text><path d="M 533 386 V 415" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ae662c)"/><rect x="378" y="415" width="310" height="96" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="395" y="446" font-size="16" fill="#ae662c" font-weight="600" text-anchor="start">User → host</text><text x="395" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Agree on material changes.</text><text x="378" y="552" font-size="18" fill="#ae662c" font-weight="600" text-anchor="start">Only affected work waits</text><text x="720" y="130" font-size="20" fill="#233345" font-weight="700" text-anchor="start">c</text><text x="750" y="130" font-size="23" fill="#536ca0" font-weight="600" text-anchor="start">Several capabilities</text><rect x="720" y="165" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="196" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">User</text><text x="737" y="231" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Review two modules.</text><path d="M 875 261 V 290" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round" marker-end="url(#536ca0)"/><rect x="720" y="290" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="321" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">Host + coordinating Skill</text><text x="737" y="356" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Route available specialists.</text><path d="M 875 386 V 415" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round" marker-end="url(#536ca0)"/><rect x="720" y="415" width="310" height="96" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="737" y="446" font-size="16" fill="#536ca0" font-weight="600" text-anchor="start">Optional subagents → host</text><text x="737" y="481" font-size="19" fill="#233345" font-weight="400" text-anchor="start">Return evidence to integrate.</text><text x="720" y="552" font-size="18" fill="#536ca0" font-weight="600" text-anchor="start">Delegate only when allowed</text><text x="36" y="609" font-size="18" fill="#607181" font-weight="400" text-anchor="start">Skills guide methods; tools act; supported, useful subagents are optional.</text></g></svg>
