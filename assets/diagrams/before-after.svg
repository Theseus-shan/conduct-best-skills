<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 540" role="img" aria-labelledby="title desc"><title id="title">Explicit coordination around the desired outcome</title><desc id="desc">Conceptual workflow instructions; not experimental data or a recorded execution.</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1050" height="540" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">b</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">Make coordination explicit</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">An organizational comparison; no measured performance claim</text><rect x="40" y="115" width="460" height="390" rx="7" fill="#ffffff" stroke="#cbd5dc" stroke-width="1.4"/><rect x="550" y="115" width="460" height="390" rx="7" fill="#ffffff" stroke="#cbd5dc" stroke-width="1.4"/><text x="65" y="155" font-size="24" fill="#233345" font-weight="600" text-anchor="start">Without a shared workflow</text><text x="575" y="155" font-size="24" fill="#167d8d" font-weight="600" text-anchor="start">With a shared task contract</text><rect x="70" y="181" width="38" height="48" rx="3" fill="#ffffff" stroke="#607181" stroke-width="1.4"/><path d="M 79 194 h 20 M 79 204 h 20 M 79 214 h 14" fill="none" stroke="#607181" stroke-width="2" stroke-linejoin="round"/><text x="128" y="209" font-size="21" fill="#233345" font-weight="400" text-anchor="start">Which context matters?</text><rect x="70" y="261" width="38" height="48" rx="3" fill="#ffffff" stroke="#607181" stroke-width="1.4"/><path d="M 79 274 h 20 M 79 284 h 20 M 79 294 h 14" fill="none" stroke="#607181" stroke-width="2" stroke-linejoin="round"/><text x="128" y="289" font-size="21" fill="#233345" font-weight="400" text-anchor="start">Which capability fits?</text><rect x="70" y="341" width="38" height="48" rx="3" fill="#ffffff" stroke="#607181" stroke-width="1.4"/><path d="M 79 354 h 20 M 79 364 h 20 M 79 374 h 14" fill="none" stroke="#607181" stroke-width="2" stroke-linejoin="round"/><text x="128" y="369" font-size="21" fill="#233345" font-weight="400" text-anchor="start">What counts as done?</text><path d="M 89 230 V 254" fill="none" stroke="#607181" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#607181)"/><path d="M 89 310 V 334" fill="none" stroke="#607181" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#607181)"/><text x="65" y="466" font-size="18" fill="#607181" font-weight="400" text-anchor="start">The user reconnects the steps.</text><rect x="575" y="188" width="410" height="68" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="594" y="215" font-size="22" fill="#167d8d" font-weight="600" text-anchor="start">Goal + context</text><text x="594" y="240" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Intent, sources, constraints</text><rect x="575" y="278" width="410" height="68" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="594" y="305" font-size="22" fill="#167d8d" font-weight="600" text-anchor="start">Select + execute</text><text x="594" y="330" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Eligible capabilities, dependencies</text><rect x="575" y="368" width="410" height="68" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="594" y="395" font-size="22" fill="#167d8d" font-weight="600" text-anchor="start">Verify + deliver</text><text x="594" y="420" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Acceptance criteria and evidence</text><path d="M 780 256 V 278" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><path d="M 780 346 V 368" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><text x="575" y="466" font-size="18" fill="#167d8d" font-weight="400" text-anchor="start">Each step serves the intended outcome.</text></g></svg>
