<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 665" role="img" aria-labelledby="title desc"><title id="title">Authorized context and experience reuse</title><desc id="desc">Conceptual workflow instructions; not experimental data or a recorded execution.</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1050" height="665" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">e</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">Context informs the task; experience informs the next</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">A conditional information flow, not automatic access or background learning</text><text x="40" y="133" font-size="23" fill="#233345" font-weight="600" text-anchor="start">Relevant sources</text><rect x="44" y="170" width="38" height="48" rx="3" fill="#ffffff" stroke="#536ca0" stroke-width="1.4"/><path d="M 53 183 h 20 M 53 193 h 20 M 53 203 h 14" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round"/><text x="100" y="200" font-size="21" fill="#233345" font-weight="400" text-anchor="start">Project files</text><rect x="44" y="245" width="38" height="48" rx="3" fill="#ffffff" stroke="#536ca0" stroke-width="1.4"/><path d="M 53 258 h 20 M 53 268 h 20 M 53 278 h 14" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round"/><text x="100" y="275" font-size="21" fill="#233345" font-weight="400" text-anchor="start">Linked knowledge</text><rect x="44" y="320" width="38" height="48" rx="3" fill="#ffffff" stroke="#536ca0" stroke-width="1.4"/><path d="M 53 333 h 20 M 53 343 h 20 M 53 353 h 14" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round"/><text x="100" y="350" font-size="21" fill="#233345" font-weight="400" text-anchor="start">Provided history</text><path d="M 290 267 H 361" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round" marker-end="url(#536ca0)"/><rect x="362" y="190" width="264" height="150" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="384" y="230" font-size="23" fill="#536ca0" font-weight="600" text-anchor="start">Access + relevance</text><text x="384" y="267" font-size="18" fill="#233345" font-weight="400" text-anchor="start">Permission · availability</text><text x="384" y="303" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Source · version · validity</text><path d="M 626 267 H 690" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="691" y="170" width="310" height="190" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><circle cx="727" cy="209" r="26" fill="#ffffff" stroke="#167d8d" stroke-width="1.8"/><circle cx="727" cy="209" r="15" fill="#ffffff" stroke="#167d8d" stroke-width="1.8"/><circle cx="727" cy="209" r="4" fill="#167d8d" stroke="#167d8d" stroke-width="1.8"/><text x="767" y="215" font-size="24" fill="#167d8d" font-weight="600" text-anchor="start">Current task</text><text x="714" y="270" font-size="20" fill="#233345" font-weight="400" text-anchor="start">Goal → capabilities → action</text><text x="714" y="311" font-size="18" fill="#607181" font-weight="400" text-anchor="start">Verify before claiming success</text><path d="M 846 360 V 429" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ae662c)"/><rect x="691" y="430" width="310" height="136" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="713" y="468" font-size="21" fill="#ae662c" font-weight="600" text-anchor="start">Save only when authorized</text><text x="713" y="504" font-size="18" fill="#233345" font-weight="400" text-anchor="start">Reliable, necessary records</text><text x="713" y="540" font-size="16" fill="#607181" font-weight="400" text-anchor="start">No default full-dialogue capture</text><path d="M 691 499 H 626" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ae662c)"/><rect x="362" y="430" width="264" height="136" rx="7" fill="#ffffff" stroke="#ae662c" stroke-width="1.4"/><text x="384" y="468" font-size="22" fill="#ae662c" font-weight="600" text-anchor="start">Eligible preferences</text><text x="384" y="505" font-size="17" fill="#233345" font-weight="400" text-anchor="start">Context + fit + freshness</text><text x="384" y="540" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Never override hard limits</text><path d="M 362 499 H 289" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ae662c)"/><rect x="40" y="430" width="248" height="136" rx="7" fill="#ffffff" stroke="#167d8d" stroke-width="1.4"/><text x="62" y="468" font-size="23" fill="#167d8d" font-weight="600" text-anchor="start">A later task</text><text x="62" y="505" font-size="18" fill="#233345" font-weight="400" text-anchor="start">Recheck before reuse</text><text x="62" y="540" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Keep the user in control</text><text x="40" y="628" font-size="18" fill="#607181" font-weight="400" text-anchor="start">Solid: task context     Dashed: optional persistence and reuse     Host interfaces are required.</text></g></svg>
