<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 842" role="img" aria-labelledby="title desc"><title id="title">依据依赖关系编排多种能力</title><desc id="desc">流程规则示意，不代表实验数据或真实执行记录。</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1050" height="842" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">d</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">依据任务依赖组合能力</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">报告任务的逻辑示意；本包不附带专业技能</text><rect x="350" y="116" width="350" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="368" y="143" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">01</text><text x="368" y="174" font-size="24" fill="#233345" font-weight="600" text-anchor="start">共同任务约定</text><text x="368" y="204" font-size="17" fill="#607181" font-weight="400" text-anchor="start">输入、范围与验收</text><path d="M 525 228 V 262 H 246 V 299" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><path d="M 525 262 H 804 V 299" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="72" y="299" width="348" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="90" y="326" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">02a</text><text x="90" y="357" font-size="24" fill="#233345" font-weight="600" text-anchor="start">数据检查</text><text x="90" y="387" font-size="17" fill="#607181" font-weight="400" text-anchor="start">分析技能 + 文件工具</text><rect x="630" y="299" width="348" height="112" rx="7" fill="#eff0f8" stroke="#536ca0" stroke-width="1.4"/><text x="648" y="326" font-size="16" fill="#536ca0" font-weight="700" text-anchor="start">02b</text><text x="648" y="357" font-size="24" fill="#233345" font-weight="600" text-anchor="start">方法审查</text><text x="648" y="387" font-size="17" fill="#607181" font-weight="400" text-anchor="start">审查技能 + 来源工具</text><text x="525" y="348" font-size="19" fill="#607181" font-weight="400" text-anchor="middle">独立工作</text><text x="525" y="377" font-size="17" fill="#607181" font-weight="400" text-anchor="middle">可行时并行</text><path d="M 246 411 V 453 H 525 V 493" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><path d="M 804 411 V 453 H 525" fill="none" stroke="#536ca0" stroke-width="2" stroke-linejoin="round"/><rect x="350" y="493" width="350" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="368" y="520" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">03</text><text x="368" y="551" font-size="24" fill="#233345" font-weight="600" text-anchor="start">整合证据</text><text x="368" y="581" font-size="17" fill="#607181" font-weight="400" text-anchor="start">主代理核查冲突</text><path d="M 525 605 V 650" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><rect x="72" y="650" width="906" height="105" rx="7" fill="#f7f9fa" stroke="#cbd5dc" stroke-width="1.4"/><text x="102" y="692" font-size="24" fill="#233345" font-weight="600" text-anchor="start">生成报告</text><text x="444" y="692" font-size="24" fill="#233345" font-weight="600" text-anchor="start">验证</text><text x="775" y="692" font-size="24" fill="#233345" font-weight="600" text-anchor="start">交付</text><path d="M 292 685 H 412" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><path d="M 562 685 H 743" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><text x="102" y="728" font-size="17" fill="#607181" font-weight="400" text-anchor="start">等待核对一致的输入</text><text x="444" y="728" font-size="17" fill="#607181" font-weight="400" text-anchor="start">当前产物与证据</text><text x="775" y="728" font-size="17" fill="#607181" font-weight="400" text-anchor="start">披露缺口</text><text x="72" y="807" font-size="17" fill="#607181" font-weight="400" text-anchor="start">委派需要明确收益、宿主支持与授权；单个代理也可执行该计划。</text></g></svg>
