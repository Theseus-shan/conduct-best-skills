<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 842" role="img" aria-labelledby="title desc"><title id="title">Dependency-aware multi-capability orchestration</title><desc id="desc">Conceptual workflow instructions; not experimental data or a recorded execution.</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1050" height="842" fill="#ffffff"/><g font-family="Arial, Helvetica, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">d</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">Composition follows dependencies</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">Illustrative report task; specialist Skills are not bundled</text><rect x="350" y="116" width="350" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="368" y="143" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">01</text><text x="368" y="174" font-size="24" fill="#233345" font-weight="600" text-anchor="start">Shared contract</text><text x="368" y="204" font-size="17" fill="#607181" font-weight="400" text-anchor="start">Input, scope, acceptance</text><path d="M 525 228 V 262 H 246 V 299" fill="none" stroke="#167d8d" stroke-width="2" stroke-line