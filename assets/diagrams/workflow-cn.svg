45" font-weight="600" text-anchor="start">交付</text><text x="66" y="388" font-size="17" fill="#607181" font-weight="400" text-anchor="start">状态与剩余缺口</text><path d="M 708 355 H 654" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><path d="M 378 355 H 324" fill="none" stroke="#167d8d" stroke-width="2" stroke-linejoin="round" marker-end="url(#167d8d)"/><text x="351" y="334" font-size="15" fill="#167d8d" font-weight="400" text-anchor="middle">通过</text><rect x="378" y="478" width="276" height="112" rx="7" fill="#faf2e6" stroke="#ae662c" stroke-width="1.4"/><text x="396" y="505" font-size="16" fill="#ae662c" font-weight="700" text-anchor="start">06</text><text x="396" y="536" font-size="24" fill="#233345" font-weight="600" text-anchor="start">修正</text><text x="396" y="566" font-size="17" fill="#607181" font-weight="400" text-anchor="start">根因与定向修复</text><path d="M 516 412 V 478" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" marker-end="url(#ae662c)"/><text x="533" y="452" font-size="16" fill="#ae662c" font-weight="400" text-anchor="start">缺口</text><path d="M 654 535 H 846 V 412" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ae662c)"/><text x="735" y="568" font-size="16" fill="#ae662c" font-weight="400" text-anchor="start">修复后重新验证</text><path d="M 378 535 H 186 V 412" fill="none" stroke="#ae662c" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ae662c)"/><text x="48" y="568" font-size="15" fill="#ae662c" font-weight="400" text-anchor="start">无可行路线 / 达到限制</text><rect x="48" y="643" width="936" height="126" rx="7" fill="#f7f9fa" stroke="#cbd5dc" stroke-width="1.4"/><text x="70" y="675" font-size="20" fill="#233345" font-weight="600" text-anchor="start">决策边界</text><text x="70" y="706" font-size="18" fill="#233345" font-weight="400" text-anchor="start">目标实质变化或授权缺失：询问用户，仅受影响工作等待。</text><text x="70" y="740" font-size="16" fill="#607181" font-weight="400" text-anchor="start">按原因回退：资料 → 01 · 目标 → 02 · 能力 → 03 · 验证方法 → 05</text></g></svg>
