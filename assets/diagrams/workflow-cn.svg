<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 800" role="img" aria-labelledby="title desc"><title id="title">七阶段工作流与有限修正</title><desc id="desc">流程规则示意，不代表实验数据或真实执行记录。</desc><defs><marker id="167d8d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167d8d"/></marker><marker id="536ca0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536ca0"/></marker><marker id="ae662c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ae662c"/></marker><marker id="607181" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#607181"/></marker></defs><rect width="1050" height="800" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif"><text x="32" y="45" font-size="25" fill="#233345" font-weight="700" text-anchor="start">a</text><text x="66" y="45" font-size="27" fill="#233345" font-weight="600" text-anchor="start">从目标理解到成果验证</text><text x="66" y="79" font-size="18" fill="#607181" font-weight="400" text-anchor="start">七个阶段，明确决策边界与恢复路径</text><rect x="48" y="119" width="276" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="66" y="146" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">01</text><text x="66" y="177" font-size="24" fill="#233345" font-weight="600" text-anchor="start">上下文</text><text x="66" y="207" font-size="17" fill="#607181" font-weight="400" text-anchor="start">来源与有效性</text><rect x="378" y="119" width="276" height="112" rx="7" fill="#eaf5f4" stroke="#167d8d" stroke-width="1.4"/><text x="396" y="146" font-size="16" fill="#167d8d" font-weight="700" text-anchor="start">02</text><text x="396" y="177" font-size="24" fill="#233345" f