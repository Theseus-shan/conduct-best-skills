#f7f9fa" stroke="#cbd5dc" stroke-width="1.4"/><text x="70" y="675" font-size="20" fill="#233345" font-weight="600" text-anchor="start">Decision boundary</text><text x="70" y="706" font-size="18" fill="#233345" font-weight="400" text-anchor="start">Material goal changes or missing authority: ask; only affected work waits.</text><text x="70" y="740" font-size="16" fill="#607181" font-weight="400" text-anchor="start">Revisit by cause: sources → 01 · goals → 02 · capabilities → 03 · check method → 05</text></g></svg>
